<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>IntegraBot · IntegraServicios S.A.</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,400;0,600;0,700;0,800&family=Syne:wght@700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --navy: #030712;
      --cyan: #5CE1FF;
      --violet: #8B7CFF;
      --gold: #F0C36A;
      --ice: #E8F4FF;
      --muted: #9BB4CC;
      --blue: #2B7FFF;
      --green: #5CFFC0;
      --orange: #FF9F5A;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      background: #02040a;
      color: #F7FBFF;
      font-family: "DM Sans", sans-serif;
      overflow: hidden;
      cursor: none;
    }
    #net {
      position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none;
      transition: filter .55s ease, transform 1.1s cubic-bezier(.16,1,.3,1);
    }
    #net.warp { filter: blur(14px) brightness(1.45) saturate(1.55); transform: scale(1.06); }
    .vignette {
      position: fixed; inset: 0; z-index: 1; pointer-events: none;
      background:
        radial-gradient(ellipse at var(--vx,50%) var(--vy,45%), transparent 18%, rgba(2,4,10,.58) 76%),
        linear-gradient(180deg, rgba(2,4,10,.22), transparent 18%, transparent 82%, rgba(2,4,10,.68));
      transition: background .9s ease;
    }
    .hud {
      position: fixed; top: 16px; left: 22px; z-index: 8;
      font-family: "JetBrains Mono", monospace; font-size: 11px; color: #7EE0FF;
      letter-spacing: .08em; opacity: .85;
    }
    .hud span { color: var(--gold); }
    .cursor {
      position: fixed; width: 14px; height: 14px; border: 1px solid var(--cyan);
      border-radius: 50%; pointer-events: none; z-index: 20; mix-blend-mode: screen;
      transform: translate(-50%,-50%); transition: width .15s, height .15s;
      box-shadow: 0 0 18px rgba(92,225,255,.6);
    }
    .cursor.big { width: 42px; height: 42px; background: rgba(92,225,255,.08); }
    .deck { height: 100%; position: relative; z-index: 2; }
    .slide {
      display: none; height: 100%;
      padding: 52px 68px 88px;
      overflow-y: auto;
    }
    .slide.on {
      display: flex; flex-direction: column; justify-content: center;
    }
    .rise { animation: rise .7s cubic-bezier(.16,1,.3,1) both; }
    @keyframes rise {
      from { opacity: 0; transform: translateY(32px) scale(.97); filter: blur(10px); }
      to { opacity: 1; transform: none; filter: none; }
    }
    .kicker {
      color: var(--cyan); letter-spacing: .22em; text-transform: uppercase;
      font-size: 11px; font-weight: 700; margin-bottom: 10px;
      text-shadow: 0 0 18px rgba(92,225,255,.45);
    }
    h1, h2 { font-family: Syne, sans-serif; }
    h1 {
      font-size: clamp(40px, 5.8vw, 72px); letter-spacing: -.045em; line-height: .98; margin-bottom: 12px;
      background: linear-gradient(100deg, #fff 10%, #5CE1FF 35%, #F0C36A 55%, #8B7CFF 75%, #fff 100%);
      background-size: 240% auto; -webkit-background-clip: text; background-clip: text; color: transparent;
      animation: flow 7s linear infinite;
    }
    h2 { font-size: clamp(26px, 3.6vw, 42px); letter-spacing: -.03em; margin-bottom: 12px; }
    @keyframes flow { to { background-position: 240% center; } }
    p.lead { font-size: 18px; color: var(--ice); max-width: 920px; line-height: 1.5; }
    .sub { color: var(--muted); font-size: 15px; margin-top: 10px; line-height: 1.45; }
    .row { display: grid; grid-template-columns: repeat(3,1fr); gap: 14px; margin-top: 18px; }
    .row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: 16px; }
    .row-4 { display: grid; grid-template-columns: repeat(4,1fr); gap: 12px; margin-top: 16px; }
    .card {
      position: relative; overflow: hidden;
      background: linear-gradient(165deg, rgba(255,255,255,.11), rgba(10,20,40,.35));
      border: 1px solid rgba(92,225,255,.18);
      border-radius: 18px; padding: 16px 16px 14px;
      backdrop-filter: blur(16px);
      box-shadow: 0 16px 50px rgba(0,0,0,.28), inset 0 1px 0 rgba(255,255,255,.12);
      animation: rise .75s both;
    }
    .card::after {
      content: ""; position: absolute; inset: -40% auto -40% -30%; width: 40%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,.12), transparent);
      transform: skewX(-18deg); animation: sweep 5.5s ease-in-out infinite;
    }
    @keyframes sweep { 0%,70% { left: -40%; } 100% { left: 130%; } }
    .slide.on .card:nth-child(1){animation-delay:.05s}
    .slide.on .card:nth-child(2){animation-delay:.12s}
    .slide.on .card:nth-child(3){animation-delay:.19s}
    .slide.on .card:nth-child(4){animation-delay:.26s}
    .card h3 { font-size: 15px; margin-bottom: 6px; }
    .card p, .card li { color: var(--ice); font-size: 14px; line-height: 1.42; }
    .card ul { padding-left: 16px; }
    .ie {
      display: inline-block; font-size: 10px; font-weight: 800; letter-spacing: .08em;
      padding: 3px 9px; border-radius: 999px; margin-bottom: 8px; margin-right: 6px;
      background: linear-gradient(90deg, #2B7FFF, #8B7CFF); color: #fff;
    }
    .ie.green { background: linear-gradient(90deg, #1a8f5a, #5CFFC0); }
    .ie.gold { background: linear-gradient(90deg, #b8860b, #F0C36A); color: #122033; }
    .metric { font-size: 42px; font-weight: 800; font-family: Syne, sans-serif; }
    .metric em { color: var(--gold); font-style: normal; text-shadow: 0 0 24px rgba(240,195,106,.4); }
    .flow { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-top: 16px; }
    .pill {
      background: linear-gradient(135deg, rgba(43,127,255,.9), rgba(139,124,255,.75));
      border: 1px solid rgba(255,255,255,.2);
      border-radius: 12px; padding: 9px 11px; font-size: 11.5px; font-weight: 700;
      box-shadow: 0 0 22px rgba(43,127,255,.28); animation: rise .6s both;
    }
    .pill.sm { font-size: 10.5px; padding: 7px 9px; }
    .pill.ext { background: linear-gradient(135deg, rgba(139,124,255,.85), rgba(90,60,180,.8)); }
    .pill.int { background: linear-gradient(135deg, rgba(43,127,255,.85), rgba(20,80,160,.8)); }
    .arrow { color: var(--gold); font-size: 18px; }
    .quote {
      border-left: 3px solid var(--cyan);
      padding: 12px 16px; font-size: 16px; line-height: 1.45; max-width: 980px;
      background: linear-gradient(90deg, rgba(92,225,255,.12), transparent);
      border-radius: 0 16px 16px 0; color: var(--ice);
    }
    .mono { font-family: "JetBrains Mono", monospace; font-size: 12px; background: rgba(0,0,0,.35); padding: 2px 6px; border-radius: 6px; color: var(--cyan); }
    .logo {
      width: 60px; height: 60px; border-radius: 50%;
      display: grid; place-items: center; font-family: Syne, sans-serif; font-weight: 800;
      background: radial-gradient(circle at 30% 30%, #8B7CFF, #2B7FFF 55%, #071A30);
      box-shadow: 0 0 0 1px rgba(92,225,255,.5), 0 0 40px rgba(92,225,255,.35);
      margin-bottom: 14px; animation: core 3.2s ease-in-out infinite;
    }
    @keyframes core {
      0%,100% { box-shadow: 0 0 0 1px rgba(92,225,255,.4), 0 0 28px rgba(92,225,255,.3); }
      50% { box-shadow: 0 0 0 6px rgba(92,225,255,.08), 0 0 48px rgba(240,195,106,.35); }
    }
    table { width: 100%; border-collapse: collapse; margin-top: 12px; font-size: 14px; }
    th, td { text-align: left; padding: 9px 11px; border-bottom: 1px solid rgba(92,225,255,.12); vertical-align: top; }
    th { color: var(--gold); font-size: 10px; letter-spacing: .1em; text-transform: uppercase; }
    td { color: var(--ice); }
    .ok { color: var(--green); font-weight: 800; }
    .warn { color: var(--orange); font-weight: 700; }
    .chip {
      display: inline-flex; align-items: center; gap: 6px;
      border: 1px solid rgba(92,225,255,.25); background: rgba(8,20,40,.45);
      border-radius: 999px; padding: 5px 11px; margin: 6px 6px 0 0; font-size: 11.5px;
    }
    .tag-in { color: var(--cyan); border-color: rgba(92,225,255,.4); }
    .tag-ex { color: var(--violet); border-color: rgba(139,124,255,.4); }
    .bar {
      position: fixed; left: 0; right: 0; bottom: 0; height: 58px; z-index: 9;
      display: flex; align-items: center; justify-content: space-between; padding: 0 22px;
      background: rgba(2,6,14,.72); backdrop-filter: blur(18px);
      border-top: 1px solid rgba(92,225,255,.15);
    }
    .progress { height: 4px; width: 240px; background: rgba(255,255,255,.1); border-radius: 9px; overflow: hidden; }
    .progress > i { display:block; height:100%; width:0; background: linear-gradient(90deg, var(--gold), var(--cyan), var(--violet)); transition: width .45s ease; }
    .nav button {
      background: transparent; color: #fff; border: 1px solid rgba(92,225,255,.3);
      border-radius: 10px; padding: 7px 12px; cursor: none; font-family: inherit; font-size: 13px;
    }
    .nav button:hover { background: rgba(43,127,255,.35); }
    .brand { font-size: 11px; color: var(--muted); letter-spacing: .12em; text-transform: uppercase; font-family: "JetBrains Mono", monospace; }
    .notes {
      display: none; position: fixed; right: 16px; top: 48px; width: min(440px, 42vw); max-height: 72vh;
      overflow: auto; z-index: 10; background: #f7fbff; color: #122033;
      border-radius: 18px; padding: 16px 18px; font-size: 13.5px; line-height: 1.55;
      box-shadow: 0 24px 70px rgba(0,0,0,.45); border: 1px solid #cfe6ff;
    }
    .notes.on { display: block; animation: rise .35s ease; }
    .notes b { color: #1a5ad9; display: block; margin-bottom: 8px; font-size: 12px; }
    .notes .priv { font-size: 10px; color: #999; margin-top: 10px; }
    .notes .time { color: #667; font-size: 11px; font-family: "JetBrains Mono", monospace; margin-bottom: 6px; }
    .flash {
      position: fixed; inset: 0; z-index: 4; pointer-events: none; opacity: 0;
      background: radial-gradient(circle at var(--gx,50%) var(--gy,50%), rgba(92,225,255,.35), transparent 42%);
    }
    .flash.go { animation: flash .55s ease; }
    @keyframes flash { 0%{opacity:0} 30%{opacity:1} 100%{opacity:0} }
    .hint {
      position: fixed; top: 16px; right: 20px; z-index: 8; color: #7aa0c0; font-size: 11px;
      font-family: "JetBrains Mono", monospace; text-align: right; line-height: 1.5;
    }
    .mod-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-top: 14px; }
    .mod {
      font-size: 11px; padding: 10px; border-radius: 12px;
      border: 1px solid rgba(92,225,255,.2); background: rgba(0,0,0,.25);
    }
    .mod strong { display: block; color: var(--cyan); font-family: "JetBrains Mono", monospace; font-size: 10px; margin-bottom: 4px; }
    .demo-num {
      display: inline-grid; place-items: center; width: 28px; height: 28px; border-radius: 8px;
      background: var(--gold); color: #122033; font-weight: 800; font-size: 13px; margin-right: 8px;
    }
    @media (max-width: 1100px) {
      .row, .row-4, .mod-grid { grid-template-columns: 1fr 1fr; }
      .slide { padding: 48px 28px 80px; }
    }
    .notes-fab {
      position: fixed;
      right: 14px;
      bottom: 70px;
      z-index: 11;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: 1px solid rgba(92,225,255,.28);
      background: rgba(2,8,18,.5);
      backdrop-filter: blur(12px);
      color: rgba(155,180,204,.9);
      display: grid;
      place-items: center;
      cursor: pointer;
      box-shadow: 0 4px 18px rgba(0,0,0,.3);
      transition: transform .15s, background .2s, border-color .2s;
      -webkit-tap-highlight-color: transparent;
      padding: 0;
    }
    .notes-fab svg { pointer-events: none; opacity: .88; }
    .notes-fab:active { transform: scale(.9); }
    .notes-fab.on {
      background: rgba(43,127,255,.4);
      border-color: rgba(92,225,255,.55);
      color: #fff;
    }
    @media (max-width: 768px), (hover: none) {
      html, body { cursor: auto; }
      .cursor { display: none; }
      .hint { display: none; }
      .hud { font-size: 9px; left: 10px; top: 10px; max-width: 55%; }
      .slide { padding: 44px 18px 76px; }
      .notes {
        left: 10px;
        right: 10px;
        top: auto;
        bottom: 64px;
        width: auto;
        max-height: min(58vh, 420px);
        font-size: 15px;
        line-height: 1.6;
        border-radius: 14px;
      }
      .notes-fab {
        bottom: 66px;
        right: 12px;
        width: 40px;
        height: 40px;
      }
      .bar { padding: 0 10px; height: 52px; }
      .brand { display: none; }
      .progress { width: 100px; }
      .nav button { padding: 8px 10px; font-size: 12px; }
    }
  </style>
</head>
<body>
  <canvas id="net"></canvas>
  <div class="vignette"></div>
  <div class="flash" id="flash"></div>
  <div class="cursor" id="cur"></div>
  <div class="hud">INTEGRABOT · <span id="view">INICIO</span> · SLIDE <span id="sl">01</span>/<span id="tot">16</span></div>
  <div class="hint">← → · <b>F</b> pantalla completa</div>
  <div class="notes" id="notes"></div>
  <button type="button" class="notes-fab" id="notesFab" aria-label="Notas">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
      <path d="M4 7h14M4 12h10M4 17h12"/>
    </svg>
  </button>
  <div class="deck" id="deck"></div>
  <div class="bar">
    <div class="brand">Diego Madrid · IntegraBot · IntegraServicios S.A.</div>
    <div class="progress"><i id="bar"></i></div>
    <div class="nav">
      <button id="prev">← Atrás</button>
      <span id="num" style="margin:0 10px;color:#9BB4CC;font-family:JetBrains Mono,monospace;font-size:12px"></span>
      <button id="next">Siguiente →</button>
    </div>
  </div>

  <script>
    const slides = [
      {
        html: `

        `,
        time: "0:00 – 0:45",

      },
      {
        html: `
          <div class="kicker">Mapa de la exposición</div>

            <div class="card"><h3>2. RAG dual</h3><p>Corpus interno + externo · Ley Karin · Código del Trabajo</p></div>

          </div>

            <div class="card"><h3>4. Prompts + guardrails</h3><p>Temperature 0.1 · anti-alucinación en código</p></div>
            <div class="card"><h3>5. Pipeline técnico</h3><p>Embeddings · MMR k=4 · ChromaDB</p></div>
            <div class="card"><h3>6. Demo en vivo</h3><p>IntegraBot · pruebas automatizadas · GitHub</p></div>
          </div>
        `,
        time: "0:45 – 1:15",
        note: "Les dejo el mapa: caso organizacional, RAG con fuentes internas y externas, arquitectura modular, prompts con guardrails, pipeline técnico con el porqué de cada decisión, y demo en vivo con pruebas automatizadas."
      },
      {
        html: `
          <div class="kicker">Problema organizacional</div>
          <h2 class="rise">Gestión de Personas saturada.</h2>
          <div class="row">
            <div class="card"><p>Consultas / mes</p><div class="metric"><em data-count="750">0</em></div><p>Bonos, permisos, reglamento, Ley Karin</p></div>
            <div class="card"><p>Meta latencia</p><div class="metric">&lt;<em data-count="5">0</em>s</div><p>Índice local + Gemini Flash</p></div>

      },
      {
        html: `

      },
      {
        html: `
          <div class="kicker">Corpus interno</div>
          <h2 class="rise">Políticas de IntegraServicios.</h2>
          <div class="row-2">
            <div class="card"><span class="chip tag-in">interno</span><h3>RIOHS 2026</h3><ul><li>Jornada 44 h · colación</li><li>Licencias médicas · EPP</li><li>Denuncia acoso · Ley Karin</li><li>Canal denuncias@integraservicios.cl</li></ul></div>

        `,

        note: "Documentos internos: RIOHS con jornada, licencias, EPP y procedimiento Ley Karin. Contrato Colectivo con colación 85 mil, 3 días administrativos, aguinaldo 180 mil, escolaridad. Metadata source_type interno en cada fragmento indexado."
      },
      {
        html: `
          <div class="kicker">Corpus externo</div>
          <h2 class="rise">Normativa laboral chilena.</h2>
          <div class="card" style="margin-top:12px">
            <span class="chip tag-ex">externo</span>
            <h3>Código del Trabajo / Ley Karin (extractos)</h3>
            <table>
              <tr><th>Norma</th><th>Contenido indexado</th></tr>
              <tr><td>Art. 32</td><td>Horas extraordinarias — recargo 50%</td></tr>
              <tr><td>Art. 35</td><td>Descanso dominical</td></tr>
              <tr><td>Art. 67</td><td>Feriado anual</td></tr>
              <tr><td>Arts. 163 / 177</td><td>Finiquitos</td></tr>

            </table>
          </div>
          <p class="sub">El colaborador no distingue interno vs externo — el copiloto sí, y lo muestra en la UI.</p>
        `,
        time: "3:45 – 4:15",
        note: "Corpus externo: extractos del Código del Trabajo y Ley Karin 21.643. Horas extra, finiquitos, feriado, descanso dominical. El trabajador pregunta sin saber si es reglamento o ley; por eso etiquetamos interno/externo en metadata y en la interfaz."
      },
      {
        html: `

      spawn();
      if (!reduced) tick();
      burst(1);
    })();

    render();
  </script>
