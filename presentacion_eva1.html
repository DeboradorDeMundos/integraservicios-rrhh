<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>IntegraBot · Núcleo neuronal · IntegraServicios</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,400;0,600;0,700;0,800&family=Syne:wght@700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --navy: #030712;
      --cyan: #5CE1FF;
      --violet: #8B7CFF;
      --gold: #F0C36A;
      --ice: #E8F4FF;
      --muted: #9BB4CC;
      --blue: #2B7FFF;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      background: #02040a;
      color: #F7FBFF;
      font-family: "DM Sans", sans-serif;
      overflow: hidden;
      cursor: none;
    }
    #fx, #net {
      position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none;
      transition: filter .55s ease, transform 1.1s cubic-bezier(.16,1,.3,1);
    }
    #net.warp { filter: blur(14px) brightness(1.45) saturate(1.55); transform: scale(1.06); }
    .vignette {
      position: fixed; inset: 0; z-index: 1; pointer-events: none;
      background:
        radial-gradient(ellipse at var(--vx,50%) var(--vy,45%), transparent 18%, rgba(2,4,10,.58) 76%),
        linear-gradient(180deg, rgba(2,4,10,.22), transparent 18%, transparent 82%, rgba(2,4,10,.68));
      transition: background .9s ease;
    }
    .hud {
      position: fixed; top: 16px; left: 22px; z-index: 8;
      font-family: "JetBrains Mono", monospace; font-size: 11px; color: #7EE0FF;
      letter-spacing: .08em; opacity: .85;
    }
    .hud span { color: var(--gold); }
    .cursor {
      position: fixed; width: 14px; height: 14px; border: 1px solid var(--cyan);
      border-radius: 50%; pointer-events: none; z-index: 20; mix-blend-mode: screen;
      transform: translate(-50%,-50%); transition: width .15s, height .15s;
      box-shadow: 0 0 18px rgba(92,225,255,.6);
    }
    .cursor.big { width: 42px; height: 42px; background: rgba(92,225,255,.08); }

    .deck { height: 100%; position: relative; z-index: 2; }
    .slide {
      display: none; height: 100%;
      padding: 56px 74px 90px;
    }
    .slide.on {
      display: flex; flex-direction: column; justify-content: center;
    }
    .rise { animation: rise .7s cubic-bezier(.16,1,.3,1) both; }
    @keyframes rise {
      from { opacity: 0; transform: translateY(32px) scale(.97); filter: blur(10px); }
      to { opacity: 1; transform: none; filter: none; }
    }
    .kicker {
      color: var(--cyan); letter-spacing: .22em; text-transform: uppercase;
      font-size: 11px; font-weight: 700; margin-bottom: 12px;
      text-shadow: 0 0 18px rgba(92,225,255,.45);
    }
    h1, h2 { font-family: Syne, sans-serif; }
    h1 {
      font-size: clamp(44px, 6.4vw, 76px); letter-spacing: -.045em; line-height: .98; margin-bottom: 14px;
      background: linear-gradient(100deg, #fff 10%, #5CE1FF 35%, #F0C36A 55%, #8B7CFF 75%, #fff 100%);
      background-size: 240% auto; -webkit-background-clip: text; background-clip: text; color: transparent;
      animation: flow 7s linear infinite;
    }
    h2 { font-size: clamp(28px, 4vw, 46px); letter-spacing: -.03em; margin-bottom: 14px; }
    @keyframes flow { to { background-position: 240% center; } }
    p.lead { font-size: 20px; color: var(--ice); max-width: 880px; line-height: 1.5; }
    .sub { color: var(--muted); font-size: 16px; margin-top: 10px; }
    .row { display: grid; grid-template-columns: repeat(3,1fr); gap: 16px; margin-top: 24px; }
    .row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 20px; }
    .card {
      position: relative; overflow: hidden;
      background: linear-gradient(165deg, rgba(255,255,255,.11), rgba(10,20,40,.35));
      border: 1px solid rgba(92,225,255,.18);
      border-radius: 20px; padding: 18px 18px 16px;
      backdrop-filter: blur(16px);
      box-shadow: 0 16px 50px rgba(0,0,0,.28), inset 0 1px 0 rgba(255,255,255,.12);
      animation: rise .75s both;
    }
    .card::after {
      content: ""; position: absolute; inset: -40% auto -40% -30%; width: 40%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,.14), transparent);
      transform: skewX(-18deg); animation: sweep 5.5s ease-in-out infinite;
    }
    @keyframes sweep { 0%,70% { left: -40%; } 100% { left: 130%; } }
    .slide.on .card:nth-child(1){animation-delay:.05s}
    .slide.on .card:nth-child(2){animation-delay:.14s}
    .slide.on .card:nth-child(3){animation-delay:.23s}
    .card h3 { font-size: 16px; margin-bottom: 7px; }
    .card p, .card li { color: var(--ice); font-size: 15px; line-height: 1.45; }
    .card ul { padding-left: 16px; }
    .ie {
      display: inline-block; font-size: 10px; font-weight: 800; letter-spacing: .08em;
      padding: 3px 9px; border-radius: 999px; margin-bottom: 8px;
      background: linear-gradient(90deg, #2B7FFF, #8B7CFF); color: #fff;
    }
    .metric { font-size: 46px; font-weight: 800; font-family: Syne, sans-serif; }
    .metric em { color: var(--gold); font-style: normal; text-shadow: 0 0 24px rgba(240,195,106,.4); }
    .flow { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-top: 22px; }
    .pill {
      background: linear-gradient(135deg, rgba(43,127,255,.9), rgba(139,124,255,.75));
      border: 1px solid rgba(255,255,255,.2);
      border-radius: 14px; padding: 11px 13px; font-size: 12.5px; font-weight: 700;
      box-shadow: 0 0 22px rgba(43,127,255,.28); animation: rise .6s both;
    }
    .arrow { color: var(--gold); font-size: 20px; }
    .quote {
      border-left: 3px solid var(--cyan);
      padding: 12px 16px; font-size: 19px; line-height: 1.45; max-width: 980px;
      background: linear-gradient(90deg, rgba(92,225,255,.12), transparent);
      border-radius: 0 16px 16px 0;
    }
    .mono { font-family: "JetBrains Mono", monospace; font-size: 13px; background: rgba(0,0,0,.35); padding: 2px 6px; border-radius: 6px; color: var(--cyan); }
    .logo {
      width: 64px; height: 64px; border-radius: 50%;
      display: grid; place-items: center; font-family: Syne, sans-serif; font-weight: 800;
      background: radial-gradient(circle at 30% 30%, #8B7CFF, #2B7FFF 55%, #071A30);
      box-shadow: 0 0 0 1px rgba(92,225,255,.5), 0 0 40px rgba(92,225,255,.35);
      margin-bottom: 16px; animation: core 3.2s ease-in-out infinite;
    }
    @keyframes core {
      0%,100% { box-shadow: 0 0 0 1px rgba(92,225,255,.4), 0 0 28px rgba(92,225,255,.3); }
      50% { box-shadow: 0 0 0 6px rgba(92,225,255,.08), 0 0 48px rgba(240,195,106,.35); }
    }
    table { width: 100%; border-collapse: collapse; margin-top: 14px; font-size: 15px; }
    th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid rgba(92,225,255,.12); }
    th { color: var(--gold); font-size: 11px; letter-spacing: .1em; text-transform: uppercase; }
    .ok { color: #5CFFC0; font-weight: 800; text-shadow: 0 0 16px rgba(92,255,192,.35); }
    .chip {
      display: inline-flex; align-items: center; gap: 6px;
      border: 1px solid rgba(92,225,255,.25); background: rgba(8,20,40,.45);
      border-radius: 999px; padding: 6px 12px; margin: 8px 8px 0 0; font-size: 12px;
    }
    .bar {
      position: fixed; left: 0; right: 0; bottom: 0; height: 62px; z-index: 9;
      display: flex; align-items: center; justify-content: space-between; padding: 0 24px;
      background: rgba(2,6,14,.72); backdrop-filter: blur(18px);
      border-top: 1px solid rgba(92,225,255,.15);
    }
    .progress { height: 4px; width: 260px; background: rgba(255,255,255,.1); border-radius: 9px; overflow: hidden; }
    .progress > i { display:block; height:100%; width:0; background: linear-gradient(90deg, var(--gold), var(--cyan), var(--violet)); transition: width .45s ease; }
    .nav button {
      background: transparent; color: #fff; border: 1px solid rgba(92,225,255,.3);
      border-radius: 10px; padding: 8px 13px; cursor: none;
    }
    .nav button:hover { background: rgba(43,127,255,.35); }
    .brand { font-size: 11px; color: var(--muted); letter-spacing: .12em; text-transform: uppercase; font-family: "JetBrains Mono", monospace; }
    .notes {
      display: none; position: fixed; right: 16px; top: 52px; width: 400px; max-height: 66vh;
      overflow: auto; z-index: 10; background: #f7fbff; color: #122033;
      border-radius: 18px; padding: 16px 18px; font-size: 14px; line-height: 1.5;
      box-shadow: 0 24px 70px rgba(0,0,0,.45); border: 1px solid #cfe6ff;
    }
    .notes.on { display: block; animation: rise .35s ease; }
    .notes b { color: #1a5ad9; }
    .flash {
      position: fixed; inset: 0; z-index: 4; pointer-events: none; opacity: 0;
      background: radial-gradient(circle at var(--gx,50%) var(--gy,50%), rgba(92,225,255,.35), transparent 42%);
    }
    .flash.go { animation: flash .55s ease; }
    @keyframes flash { 0%{opacity:0} 30%{opacity:1} 100%{opacity:0} }
    .hint { position: fixed; top: 16px; right: 20px; z-index: 8; color: #7aa0c0; font-size: 11px; font-family: "JetBrains Mono", monospace; }
  </style>
</head>
<body>
  <canvas id="net"></canvas>
  <div class="vignette"></div>
  <div class="flash" id="flash"></div>
  <div class="cursor" id="cur"></div>
  <div class="hud">NÚCLEO AGENTE · <span id="view">ESTABLECIMIENTO</span> · SINAPSIS <span id="syn">0</span> · NODOS <span id="nod">0</span> · SLIDE <span id="sl">01</span></div>
  <div class="hint">← →  N=guion  F=full</div>
  <div class="notes" id="notes"></div>
  <div class="deck" id="deck"></div>
  <div class="bar">
    <div class="brand">Diego Madrid · 011V_OLS · IntegraBot</div>
    <div class="progress"><i id="bar"></i></div>
    <div class="nav">
      <button id="prev">Atrás</button>
      <span id="num" style="margin:0 12px;color:#9BB4CC;font-family:JetBrains Mono,monospace;font-size:12px"></span>
      <button id="next">Siguiente</button>
    </div>
  </div>

  <script>
    const slides = [
      {
        html: `
          <div class="logo rise">IB</div>
          <div class="kicker rise">Asistente de cumplimiento laboral · IntegraServicios S.A.</div>
          <h1 class="rise">IntegraBot</h1>
          <p class="lead rise">Un trabajador pregunta. El sistema busca en los documentos oficiales, responde y cita la fuente. Si no puede respaldar la respuesta, no inventa: deriva a una persona.</p>

            <span class="chip">Diego Madrid</span>
            <span class="chip">Ingeniería de soluciones con IA · 011V_OLS</span>

        `,
        note: "Hola, buenas tardes. Soy Diego Madrid y les presento IntegraBot, un asistente para IntegraServicios, una empresa de servicios que usamos como caso. Está pensado para Gestión de Personas.<br><br>La idea es bien concreta: alguien pregunta por un beneficio o una norma, el sistema busca en los documentos oficiales y responde citando de dónde salió. Si no tiene cómo respaldarlo, no se inventa la respuesta: la pasa a un humano.<br><br>En un minuto les cuento el problema, cómo está armado y después lo enciendo."
      },
      {
        html: `
          <div class="kicker">El recorrido</div>
          <h2 class="rise">Qué les voy a mostrar.</h2>
          <div class="row">
            <div class="card"><h3>El problema</h3><p>Una cola de consultas repetidas y el riesgo de inventar una norma.</p></div>
            <div class="card"><h3>Cómo está armado</h3><p>Interfaz, reglas del asistente, motor de búsqueda y documentos.</p></div>
            <div class="card"><h3>De dónde sabe</h3><p>Reglamento interno, contrato colectivo y Código del Trabajo.</p></div>
          </div>
          <div class="row-2">
            <div class="card"><h3>Cuando no sabe</h3><p>Si no hay respaldo en esos papeles, deriva. No completa con ocurrencias.</p></div>
            <div class="card"><h3>Cómo se comprueba</h3><p>En el chat se ve qué fragmentos usó. Después, la demo en vivo.</p></div>
          </div>
        `,
        note: "Les dejo el mapa para que no se pierdan. Primero el problema de negocio. Después cómo está construido y de dónde saca la información. Luego lo más delicado: qué hace cuando no sabe. Y al final lo abrimos y hacemos tres preguntas reales."
      },
      {
        html: `
          <div class="kicker">El problema</div>
          <h2 class="rise">RRHH saturado con las mismas preguntas.</h2>
          <div class="row">
            <div class="card"><p>Carga</p><div class="metric"><em data-count="750">0</em></div><p>consultas al mes: bonos, permisos, reglamento.</p></div>
            <div class="card"><p>Tiempo</p><div class="metric">&lt; <em data-count="5">0</em>s</div><p>la meta es responder en segundos, no al día siguiente.</p></div>
            <div class="card"><p>Inventar normas</p><div class="metric"><em>0</em></div><p>si no está en el documento, no hay respuesta inventada.</p></div>
          </div>
        `,
        note: "El punto de partida es una cola. Imaginen unos setecientos cincuenta tickets al mes, y varios son siempre lo mismo: la colación, los días administrativos, cómo denunciar por Ley Karin. Eso hoy espera a alguien del área.<br><br>Yo no busqué un chat simpático. Busqué uno que conteste rápido —en el orden de unos segundos— y, sobre todo, que no se invente derecho laboral."
      },
      {
        html: `
          <div class="kicker">Hasta dónde llega</div>
          <h2 class="rise">Filtra lo repetido. Lo difícil lo decide una persona.</h2>
          <div class="row-2">
            <div class="card"><h3>Se queda el asistente</h3><ul><li>Consultas frecuentes, a cualquier hora</li><li>La misma fuente oficial para todos</li><li>Artículo o cláusula citada</li></ul></div>

        note: "Importante decirlo de entrada: IntegraBot no reemplaza a Gestión de Personas. Se queda con lo repetitivo —la misma pregunta, la misma respuesta oficial, con artículo o cláusula—. Lo sensible, un sumario, un finiquito en conflicto, una decisión de jefatura, sigue siendo humano.<br><br>El valor es menos cola y más consistencia, no sustituir criterio."
      },
      {
        html: `
          <div class="kicker">Cómo está armado</div>

            <div class="pill">Interfaz · app.py</div><div class="arrow">→</div>

      },
      {
        html: `

          <h2 class="rise">No le pasamos el PDF entero al modelo.</h2>

            <div class="pill">PDF</div><div class="arrow">→</div>

        html: `

        `,
        note: "Las reglas están escritas, no se las dejo al modelo. Tiene un rol, recibe lo que se recuperó y la pregunta, y tiene que citar así: archivo y cláusula o artículo.<br><br>Temperatura baja, porque no queremos creatividad jurídica. Y si en una misma pregunta hay algo que sí está en los papeles y algo que no, lo separa: responde lo documentado y deriva lo otro."

      {
        html: `

      {

          <p class="sub">github.com/DeboradorDeMundos/integraservicios-rrhh</p>

      },
      {
        html: `
          <div class="kicker">Con qué corre</div>
          <h2 class="rise">Stack concreto, para que arranque de verdad.</h2>
          <table>
            <tr><th>Pieza</th><th>Tecnología</th></tr>
            <tr><td>Modelo</td><td>Gemini 2.5 Flash</td></tr>
            <tr><td>Embeddings</td><td>gemini-embedding-001 — el que Google mantiene hoy</td></tr>

        `,

      },
      {
        html: `
          <div class="kicker">Demo</div>
          <h2 class="rise">Tres preguntas. Las mismas que haría un trabajador.</h2>
          <div class="row">
            <div class="card"><h3>1. Un beneficio</h3><p>Días administrativos o colación. Tiene que citar el contrato.</p></div>
            <div class="card"><h3>2. Cumplimiento</h3><p>Cómo denunciar por Ley Karin. Tiene que anclarse al reglamento.</p></div>
            <div class="card"><h3>3. Lo que no sabe</h3><p>¿Va a llover mañana? Tiene que derivar. Después abro las fuentes.</p></div>
          </div>
          <p class="sub">Si tarda un segundo, está buscando en los documentos. Eso es normal.</p>
        `,
        note: "Ahora lo muestro. Paso al chat. Si ven los puntitos de carga, es el sistema pensando: no me pongo nervioso.<br><br>Primero un beneficio: días administrativos o colación; tiene que citar el contrato. Segundo, cumplimiento: cómo denunciar por Ley Karin, anclado al reglamento. Tercero, la trampa: si va a llover. Ahí debería derivar.<br><br>Después abro las fuentes para que vean qué documentos tocó, y señalo cuál coincidió con la cita."
      },
      {
        html: `
          <div class="kicker">Cierre</div>
          <h2 class="rise">No se inventa las normas. Las busca.</h2>
          <p class="lead">IntegraBot baja la cola de consultas repetidas, cita de dónde salió cada respuesta y, cuando no tiene respaldo, se la pasa a una persona.</p>
          <p class="sub">Diego Madrid · Ingeniería de soluciones con IA · 011V_OLS</p>
          <p class="ok" style="margin-top:20px;font-size:20px">github.com/DeboradorDeMundos/integraservicios-rrhh</p>
        `,
        note: "Con eso cierro. IntegraBot no opina ni se inventa el Código del Trabajo: busca, cita y, cuando no tiene respaldo, escala.<br><br>Soy Diego Madrid. Muchas gracias. Si tienen preguntas, con gusto las respondo."
      }
    ];

    let i = 0;
    const deck = document.getElementById("deck");
    const notesEl = document.getElementById("notes");
    const bar = document.getElementById("bar");
    const num = document.getElementById("num");
    const flash = document.getElementById("flash");
    const cur = document.getElementById("cur");

    function counts() {
      document.querySelectorAll(".slide.on [data-count]").forEach((el) => {
        const end = +el.dataset.count, t0 = performance.now();
        const tick = (n) => {
          const p = Math.min(1, (n - t0) / 900);
          el.textContent = Math.round(end * (1 - Math.pow(1 - p, 3)));
          if (p < 1) requestAnimationFrame(tick);
        };
        requestAnimationFrame(tick);
      });
    }
    function render() {
      deck.innerHTML = slides.map((s, n) => `<section class="slide${n===i?" on":""}">${s.html}</section>`).join("");
      notesEl.innerHTML = `<b>Guion ${i+1} / ${slides.length}</b><br><br>${slides[i].note}`;
      bar.style.width = ((i+1)/slides.length)*100 + "%";
      num.textContent = String(i+1).padStart(2,"0") + " / " + String(slides.length).padStart(2,"0");
      document.getElementById("sl").textContent = String(i+1).padStart(2,"0");
      counts();
      if (window.setNetView) window.setNetView(i);
      flash.classList.remove("go");
      void flash.offsetWidth;
      flash.classList.add("go");
    }
    function go(d) {
      i = Math.max(0, Math.min(slides.length-1, i+d));
      render();
    }
    document.getElementById("prev").onclick = () => go(-1);
    document.getElementById("next").onclick = () => go(1);
    addEventListener("keydown", (e) => {
      if (e.key === "ArrowRight" || e.key === " ") { e.preventDefault(); go(1); }
      if (e.key === "ArrowLeft") go(-1);
      if (e.key === "n" || e.key === "N") notesEl.classList.toggle("on");
      if (e.key === "f" || e.key === "F") document.documentElement.requestFullscreen?.();
    });
    deck.addEventListener("click", (e) => {
      if (e.target.closest("button")) return;
      go(e.clientX > innerWidth/2 ? 1 : -1);
    });
    addEventListener("mousemove", (e) => {
      cur.style.left = e.clientX + "px";
      cur.style.top = e.clientY + "px";
      document.documentElement.style.setProperty("--gx", e.clientX + "px");
      document.documentElement.style.setProperty("--gy", e.clientY + "px");
    });
    document.querySelectorAll("button").forEach((b) => {
      b.addEventListener("mouseenter", () => cur.classList.add("big"));
      b.addEventListener("mouseleave", () => cur.classList.remove("big"));
    });

    /* Misma red 3D: cada slide es una cámara distinta */
    (function neural() {
      const c = document.getElementById("net");
      const ctx = c.getContext("2d");
      const viewEl = document.getElementById("view");
      let w, h, nodes, links, t = 0, fly = 0;
      const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
      const views = [
        { name: "ESTABLECIMIENTO", x: 0, y: 18, z: 40, ry: 0.04, rx: 0.22, rz: 0, zoom: 0.72, vx: "50%", vy: "46%", pulse: 1.0 },
        { name: "ÓRBITA DERECHA", x: 110, y: -28, z: -20, ry: 0.72, rx: 0.18, rz: 0.04, zoom: 1.12, vx: "62%", vy: "40%", pulse: 1.1 },
        { name: "CONTRAVISTA", x: -140, y: 36, z: 30, ry: -0.85, rx: -0.12, rz: -0.06, zoom: 1.28, vx: "38%", vy: "52%", pulse: 1.15 },
        { name: "CENITAL", x: 20, y: -160, z: 10, ry: 0.18, rx: 0.92, rz: 0, zoom: 1.05, vx: "50%", vy: "28%", pulse: 0.9 },
        { name: "PERFIL", x: 8, y: 10, z: 0, ry: 1.48, rx: 0.08, rz: 0, zoom: 1.18, vx: "70%", vy: "48%", pulse: 1.05 },
        { name: "SINAPSIS", x: 40, y: 8, z: -30, ry: 0.55, rx: 0.12, rz: 0.08, zoom: 1.72, vx: "46%", vy: "44%", pulse: 1.35 },
        { name: "HEMISFERIO", x: -90, y: 12, z: 50, ry: -0.42, rx: 0.16, rz: 0, zoom: 1.08, vx: "34%", vy: "46%", pulse: 1.0 },
        { name: "NÚCLEO", x: 6, y: 4, z: 8, ry: 0.12, rx: 0.06, rz: 0, zoom: 2.35, vx: "50%", vy: "48%", pulse: 1.4 },
        { name: "SILENCIO", x: 210, y: 90, z: 80, ry: -1.15, rx: 0.28, rz: 0.12, zoom: 0.58, vx: "72%", vy: "62%", pulse: 0.35 },
        { name: "TRAZAS", x: 48, y: -18, z: -12, ry: 0.32, rx: 0.2, rz: -0.05, zoom: 1.55, vx: "54%", vy: "42%", pulse: 1.25 },
        { name: "CORTE", x: -55, y: 95, z: -40, ry: -0.28, rx: -0.55, rz: 0.1, zoom: 1.32, vx: "44%", vy: "68%", pulse: 1.05 },
        { name: "DISPARO", x: 24, y: -8, z: 16, ry: 0.22, rx: 0.1, rz: 0, zoom: 1.42, vx: "52%", vy: "44%", pulse: 1.45 },
        { name: "HORIZONTE", x: 0, y: 30, z: 70, ry: 0.15, rx: 0.32, rz: 0, zoom: 0.62, vx: "50%", vy: "40%", pulse: 0.85 }
      ];
      let cam = { ...views[0] };
      let target = { ...views[0] };
      let firstView = true;

      function spawn() {
        w = c.width = innerWidth * devicePixelRatio;
        h = c.height = innerHeight * devicePixelRatio;
        c.style.width = innerWidth + "px";
        c.style.height = innerHeight + "px";
        ctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
        w = innerWidth; h = innerHeight;
        const n = Math.min(92, Math.floor(w * h / 13500));
        nodes = [];
        for (let k = 0; k < n; k++) {
          const ring = k % 6;
          const ang = (k / n) * Math.PI * 2 + ring * 0.37;
          const elev = ((k % 8) - 3.5) * 0.2;
          const rad = 95 + ring * 52 + (k % 3) * 8;
          nodes.push({
            wx: Math.cos(ang) * Math.cos(elev) * rad,
            wy: Math.sin(elev) * rad * 0.88,
            wz: Math.sin(ang) * Math.cos(elev) * rad,
            vx: (Math.random() - 0.5) * 0.22,
            vy: (Math.random() - 0.5) * 0.18,
            vz: (Math.random() - 0.5) * 0.22,
            e: Math.random(),
            r: 1.35 + Math.random() * 1.7
          });
        }
        nodes.push({ wx: 0, wy: 0, wz: 0, vx: 0, vy: 0, vz: 0, e: 1, r: 4.4, core: true });
        links = [];
        for (let a = 0; a < nodes.length; a++) {
          for (let b = a + 1; b < nodes.length; b++) {
            const d = Math.hypot(
              nodes[a].wx - nodes[b].wx,
              nodes[a].wy - nodes[b].wy,
              nodes[a].wz - nodes[b].wz
            );
            if (d < 118 && Math.random() < 0.28) links.push({ a, b, pulses: [] });
          }
        }
        document.getElementById("nod").textContent = nodes.length;
        document.getElementById("syn").textContent = links.length;
      }

      function burst(mult) {
        const m = mult == null ? 1 : mult;
        nodes.forEach((n) => n.e = Math.min(1, n.e + (n.core ? 1 : Math.random() * 0.75 * m)));
        links.forEach((L) => {
          if (Math.random() < 0.42 * m) L.pulses.push({ p: 0, s: 0.012 + Math.random() * 0.022, gold: Math.random() > 0.55 });
        });
      }

      function project(n) {
        let x = n.wx - cam.x, y = n.wy - cam.y, z = n.wz - cam.z;
        const cy = Math.cos(cam.ry), sy = Math.sin(cam.ry);
        const cx = Math.cos(cam.rx), sx = Math.sin(cam.rx);
        const cz = Math.cos(cam.rz), sz = Math.sin(cam.rz);
        let x1 = x * cy + z * sy;
        let z1 = -x * sy + z * cy;
        let y1 = y * cx - z1 * sx;
        let z2 = y * sx + z1 * cx;
        const x2 = x1 * cz - y1 * sz;
        const y2 = x1 * sz + y1 * cz;
        const persp = 520 / (520 + z2);
        return {
          x: w / 2 + x2 * persp * cam.zoom,
          y: h / 2 + y2 * persp * cam.zoom,
          s: persp,
          z: z2,
          vis: z2 > -480 && persp > 0.15
        };
      }

      window.setNetView = function (idx) {
        target = { ...views[idx % views.length] };
        viewEl.textContent = target.name;
        document.documentElement.style.setProperty("--vx", target.vx);
        document.documentElement.style.setProperty("--vy", target.vy);
        fly = 1;
        burst(target.pulse);
        if (firstView) { firstView = false; return; }
        c.classList.add("warp");
        setTimeout(() => c.classList.remove("warp"), 280);
      };

      function lerp(a, b, k) { return a + (b - a) * k; }

      function tick() {
        t += 0.008;
        const k = reduced ? 1 : 0.042 + fly * 0.09;
        fly *= 0.935;
        const drift = reduced ? 0 : Math.sin(t * 0.22) * 10;
        cam.x = lerp(cam.x, target.x + drift, k);
        cam.y = lerp(cam.y, target.y + Math.cos(t * 0.18) * 6, k);
        cam.z = lerp(cam.z, target.z, k);
        cam.ry = lerp(cam.ry, target.ry + (reduced ? 0 : Math.sin(t * 0.13) * 0.06), k);
        cam.rx = lerp(cam.rx, target.rx, k);
        cam.rz = lerp(cam.rz, target.rz, k);
        cam.zoom = lerp(cam.zoom, target.zoom, k);

        ctx.clearRect(0, 0, w, h);
        ctx.globalCompositeOperation = "lighter";

        const drawn = nodes.map((n, i) => {
          if (!n.core && !reduced) {
            n.wx += n.vx; n.wy += n.vy; n.wz += n.vz;
            const mag = Math.hypot(n.wx, n.wy, n.wz);
            if (mag > 430) { n.vx *= -1; n.vy *= -1; n.vz *= -1; }
          } else if (n.core) {
            n.wx = Math.sin(t) * 6;
            n.wy = Math.cos(t * 0.9) * 5;
            n.wz = Math.sin(t * 0.7) * 4;
          }
          n.e *= 0.976;
          return { n, i, p: project(n) };
        }).filter((d) => d.p.vis).sort((a, b) => a.p.z - b.p.z);

        const byI = new Map(drawn.map((d) => [d.i, d.p]));
        const rate = 0.004 + (target.pulse || 1) * 0.006;

        for (const L of links) {
          const A = byI.get(L.a), B = byI.get(L.b);
          if (!A || !B) continue;
          const depth = Math.max(0.2, (A.s + B.s) / 2);
          ctx.beginPath();
          ctx.moveTo(A.x, A.y); ctx.lineTo(B.x, B.y);
          ctx.strokeStyle = `rgba(90,170,255,${(0.035 + 0.07 * depth) * (0.55 + (nodes[L.a].e + nodes[L.b].e) / 3)})`;
          ctx.lineWidth = depth;
          ctx.stroke();
          L.pulses = L.pulses.filter((pu) => pu.p < 1);
          for (const pu of L.pulses) {
            if (!reduced) pu.p += pu.s;
            const x = A.x + (B.x - A.x) * pu.p;
            const y = A.y + (B.y - A.y) * pu.p;
            ctx.beginPath();
            ctx.arc(x, y, (pu.gold ? 2.3 : 1.7) * depth, 0, Math.PI * 2);
            ctx.fillStyle = pu.gold ? "rgba(240,195,106,.95)" : "rgba(92,225,255,.95)";
            ctx.fill();
            if (pu.p > 0.92) nodes[L.b].e = Math.min(1, nodes[L.b].e + 0.35);
          }
          if (!reduced && Math.random() < rate) L.pulses.push({ p: 0, s: 0.01 + Math.random() * 0.02, gold: Math.random() > 0.6 });
        }

        for (const { n, p } of drawn) {
          const size = (n.r + n.e * 2) * p.s;
          if (n.core) {
            const g = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, 28 * p.s);
            g.addColorStop(0, "rgba(240,195,106,.92)");
            g.addColorStop(1, "rgba(43,127,255,0)");
            ctx.beginPath(); ctx.arc(p.x, p.y, 26 * p.s, 0, Math.PI * 2); ctx.fillStyle = g; ctx.fill();
          }
          ctx.beginPath();
          ctx.arc(p.x, p.y, size, 0, Math.PI * 2);
          ctx.fillStyle = n.core ? "#fff" : `rgba(92,225,255,${0.22 + n.e * 0.75})`;
          ctx.fill();
        }
        ctx.globalCompositeOperation = "source-over";
        requestAnimationFrame(tick);
      }
      addEventListener("resize", spawn);
      spawn();
      if (!reduced) tick();
      else {
        ctx.clearRect(0, 0, w, h);
      }
      burst(1);
    })();

    render();
  </script>
